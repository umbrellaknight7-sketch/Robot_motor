wheel_human_kinematics:
  ros__parameters:
    planning_groups: [left_arm, right_arm]
    groups.left_arm.joints: [Left_Shoulder_Joint, Left_Arm_Joint1, Left_Arm_Joint2, Left_Arm_Joint3, Left_Arm_Joint4, Left_Wrist_Joint]
    groups.left_arm.tip: Left_Hand_TCP
    groups.right_arm.joints: [Right_Shoulder_Joint, Right_Arm_Joint1, Right_Arm_Joint2, Right_Arm_Joint3, Right_Arm_Joint4, Right_Wrist_Joint]
    groups.right_arm.tip: Right_Hand_TCP

    # Iteration and wall-clock budgets for calculation-only IK queries.
    solver.max_iterations: 200
    solver.timeout_seconds: 0.1
    solver.max_joint_step: 0.1

    # Position tolerance is in metres; orientation tolerance is in radians.
    solver.position_tolerance: 0.0001
    solver.orientation_tolerance: 0.001
    solver.orientation_scale: 0.1
    solver.damping: 0.001
