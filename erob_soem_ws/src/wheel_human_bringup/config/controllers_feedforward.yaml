controller_manager:
  ros__parameters:
    update_rate: 1000
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    csp_controller:
      type: erob_controllers/CspTrajectoryController

csp_controller:
  ros__parameters:
    joints: [Feet_Joint, Knee_Joint, Hip_Joint, Neck_Joint, Face_Joint, Left_Shoulder_Joint, Left_Arm_Joint1, Left_Arm_Joint2, Left_Arm_Joint3, Left_Arm_Joint4, Right_Shoulder_Joint, Right_Arm_Joint1, Right_Arm_Joint2, Right_Arm_Joint3, Right_Arm_Joint4]
    command_interfaces: [position, velocity_offset, torque_offset]
    open_loop_control: false
    set_last_command_interface_value_as_state_on_activation: false
    state_interfaces: [position, velocity]
    config_file: "$(var config_file)"
    heartbeat_timeout: 0.5
    goal_tolerance: 0.01
    settle_timeout: 3.0
